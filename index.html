<html lang="el">
<head>

<title>Pride Month 2026 — Queer Cinema Watchlist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏳️‍🌈</text></svg>">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .35s,color .35s}

:root{
--bg:#0A0A0F;--card:rgba(255,255,255,0.03);--text:#E8E6F0;--sub:#9994B8;--muted:#7A7594;
--border:rgba(255,255,255,0.08);--border-light:rgba(255,255,255,0.06);
--accent:#FF6B9D;--accent-soft:rgba(255,107,157,0.12);
--watched-bg:rgba(0,206,209,0.05);--watched-border:rgba(0,206,209,0.3);--watched:#00CED1;
--progress-bg:rgba(255,255,255,0.08);--filter-border:rgba(255,255,255,0.1);
--star:#FFD700;--toggle-bg:rgba(255,255,255,0.06);
}
.light{
--bg:#F8F6F1;--card:rgba(0,0,0,0.02);--text:#1A1A2E;--sub:#6B6B80;--muted:#9999AA;
--border:rgba(0,0,0,0.08);--border-light:rgba(0,0,0,0.05);
--accent:#D63384;--accent-soft:rgba(214,51,132,0.08);
--watched-bg:rgba(0,139,139,0.04);--watched-border:rgba(0,139,139,0.2);--watched:#008B8B;
--progress-bg:rgba(0,0,0,0.06);--filter-border:rgba(0,0,0,0.1);
--star:#B8860B;--toggle-bg:rgba(0,0,0,0.06);
}

.container{max-width:820px;margin:0 auto;padding:24px 12px;overflow:hidden}
.center{text-align:center}
.flex{display:flex;align-items:center}
.flex-wrap{flex-wrap:wrap}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}
.justify-center{justify-content:center}
.justify-between{justify-content:space-between}
.col{flex-direction:column}

.pride-label{font-size:14px;letter-spacing:6px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.pride-title{font-family:'Playfair Display',Georgia,serif;font-size:42px;font-weight:800;line-height:1.1;background:linear-gradient(135deg,#FF6B9D,#7B68EE,#00CED1,#FFD700,#FF8C00,#FF6B9D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pride-sub{color:var(--sub);font-size:15px;margin-top:10px}

.btn{padding:8px 16px;border-radius:20px;border:1.5px solid var(--filter-border);background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:hover{opacity:.85}
.btn-accent{background:linear-gradient(135deg,#FF6B9D,#7B68EE);border:none;color:#fff;font-weight:700}
.btn-sm{padding:5px 14px;border-radius:14px;font-size:12px;font-weight:500}

.input{padding:14px 20px;border-radius:16px;border:2px solid rgba(123,104,238,0.3);background:rgba(255,255,255,0.04);color:var(--text);font-size:16px;font-family:inherit;text-align:center;outline:none;width:100%;max-width:100%}
.light .input{background:rgba(0,0,0,0.04);color:var(--text)}

.film-card{border-radius:12px;padding:12px 16px;cursor:pointer;transition:all .2s;border:1px solid var(--border);width:100%;overflow-wrap:break-word}
.film-card:hover{transform:translateY(-1px)}
.film-card.watched{opacity:.65}

.badge-pill{font-size:10px;padding:1px 7px;border-radius:6px;font-weight:700;white-space:nowrap}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,0.06);color:var(--sub)}
.light .tag{background:rgba(0,0,0,0.04)}

.lb-entry{border-radius:10px;overflow:hidden;transition:all .2s;border:1px solid transparent;width:100%}
.lb-entry:hover{background:rgba(255,255,255,0.02)}
.light .lb-entry:hover{background:rgba(0,0,0,0.02)}

.imdb-box{margin-top:12px;padding:14px;border-radius:10px;background:rgba(245,197,24,0.05);border:1px solid rgba(245,197,24,0.15)}
.light .imdb-box{background:rgba(245,197,24,0.04);border-color:rgba(245,197,24,0.12)}
.imdb-badge{font-size:13px;font-weight:800;color:#F5C518;background:rgba(245,197,24,0.15);padding:3px 8px;border-radius:6px}
.imdb-link{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 16px;border-radius:10px;background:#F5C518;color:#000;font-size:12px;font-weight:800;text-decoration:none;letter-spacing:.5px}
.imdb-link:hover{opacity:.85}

.section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:8px}

.progress-bar{height:6px;border-radius:3px;background:var(--progress-bg);overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#FF6B9D,#7B68EE,#00CED1);transition:width .4s ease}

.logo-circle{border-radius:50%;object-fit:cover}

/* Leaderboard panel */
.lb-panel{margin-bottom:28px;padding:20px;border-radius:16px;width:100%}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease forwards}

/* Mobile */
@media(max-width:480px){
.pride-title{font-size:28px!important}
.pride-sub{font-size:13px!important}
.btn{padding:5px 10px;font-size:11px}
.container{padding:12px 8px}
.film-card{padding:10px 10px}
.lb-panel{padding:14px 10px}
.section-header{flex-wrap:wrap}
}
@media(max-width:360px){
.pride-title{font-size:24px!important}
.container{padding:10px 6px}
}
</style>

const TMDB_SEARCH="https://api.themoviedb.org/3/search/movie";
const posterCache={};
async function fetchPoster(title,year){
  const key=title+"_"+year;
  if(posterCache[key]!==undefined)return posterCache[key];
  try{
    const r=await fetch(TMDB_SEARCH+"?api_key="+TMDB_KEY+"&query="+encodeURIComponent(title)+"&year="+year+"&language=en-US");
    const d=await r.json();
    if(d.results&&d.results.length>0&&d.results[0].poster_path){
      posterCache[key]=TMDB_BASE+d.results[0].poster_path;
    }else{posterCache[key]=null;}
  }catch(e){posterCache[key]=null;}
  return posterCache[key];
}

  const batch=6;

  }
}

function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")el.className=v;
    else if(k==="innerHTML")el.innerHTML=v;
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false)return;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);
  });
  return el;
}

            detail.appendChild(imdb);
          }
          card.appendChild(detail);
        }
        filmList.appendChild(card);
      });
      section.appendChild(filmList);
      container.appendChild(section);
    });
  }
  
  // Footer
  const footer=h("div",{className:"center",style:{padding:"32px 0 16px",borderTop:"1px solid var(--border-light)",marginTop:"16px"}});
  const footerLogo=h("div",{className:"flex justify-center gap-12",style:{marginBottom:"12px"}});
  footerLogo.appendChild(h("img",{src:LOGO_SRC,className:"logo-circle",style:{width:"48px",height:"48px",border:"2px solid rgba(255,140,0,0.4)"}}));
  const footerText=h("div",{style:{textAlign:"left"}});
  footerText.appendChild(h("div",{style:{fontSize:"11px",letterSpacing:"2px",textTransform:"uppercase",color:"var(--muted)"}},"Powered by"));
  footerText.appendChild(h("div",{style:{fontSize:"18px",fontWeight:"800",fontFamily:"'Playfair Display',Georgia,serif",background:"linear-gradient(135deg,#E8A100,#FF6B00)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"Petros Plex"));
  footerLogo.appendChild(footerText);
  footer.appendChild(footerLogo);
  footer.appendChild(h("div",{style:{fontSize:"28px",marginBottom:"8px"}},"🏳️‍🌈"));
  footer.appendChild(h("p",{style:{fontSize:"12px",color:"var(--muted)"}},"Happy Pride Month! Καλές προβολές!"));
  container.appendChild(footer);
  
  app.appendChild(container);
}

function renderWelcome(app){
  const lb=getLeaderboardSorted();
  const outer=h("div",{style:{minHeight:"100vh",background:"#0A0A0F",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 16px"}});
  const inner=h("div",{className:"center",style:{maxWidth:"480px",width:"100%",padding:"0 16px"}});
  
  inner.appendChild(h("img",{src:LOGO_SRC,className:"logo-circle",style:{width:"80px",height:"80px",border:"3px solid rgba(255,140,0,0.4)",marginBottom:"16px"}}));
  inner.appendChild(h("div",{style:{fontSize:"11px",letterSpacing:"3px",textTransform:"uppercase",color:"#7A7594",marginBottom:"4px"}},"Powered by"));
  inner.appendChild(h("div",{style:{fontSize:"22px",fontWeight:"800",fontFamily:"'Playfair Display',Georgia,serif",background:"linear-gradient(135deg,#E8A100,#FF6B00)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:"28px"}},"Petros Plex"));
  inner.appendChild(h("div",{style:{fontSize:"14px",letterSpacing:"6px",textTransform:"uppercase",color:"#FF6B9D",fontWeight:"700",marginBottom:"8px"}},"Pride Month 2026"));
  inner.appendChild(h("h1",{className:"pride-title",style:{fontSize:"38px",marginBottom:"12px"}},"Queer Cinema Watchlist"));
  const subtitle=h("p",{style:{color:"#9994B8",fontSize:"14px",margin:"0 0 32px",lineHeight:"1.6"}});
  subtitle.innerHTML=`${films.length} ταινίες. Ένα leaderboard. Μία κορώνα.<br/><span style="color:#FFD700">Ποιο θα γίνει το Queer Mother Supreme;</span>`;
  inner.appendChild(subtitle);
  
  if(!state.authReady){
    // Loading state
    inner.appendChild(h("div",{style:{color:"#9994B8",fontSize:"14px"}},"Φόρτωση..."));
  } else if(state.uid && !state.username){
    // Signed in but no display name set yet — ask for name
    inner.appendChild(h("div",{style:{color:"#9994B8",fontSize:"14px",marginBottom:"16px"}},"Καλώς ήρθες! Διάλεξε ένα display name:"));
    const nameInp=h("input",{className:"input",type:"text",placeholder:"Το όνομά σου...",style:{marginBottom:"20px",color:"#E8E6F0"}});
    nameInp.addEventListener("input",e=>{state.inputName=e.target.value;});
    nameInp.addEventListener("keydown",e=>{if(e.key==="Enter")setDisplayName();});
    inner.appendChild(nameInp);
    inner.appendChild(h("button",{className:"btn btn-accent",style:{padding:"14px 40px",fontSize:"15px",letterSpacing:"1px",borderRadius:"20px"},onClick:setDisplayName},"🏳️‍🌈 Ξεκίνα το Challenge"));
  } else {
    // Not signed in — show Google Sign-In button
    const googleBtn=h("button",{style:{
      padding:"14px 32px",borderRadius:"20px",border:"none",cursor:"pointer",
      background:"#fff",color:"#333",fontSize:"15px",fontWeight:"700",
      fontFamily:"'DM Sans',sans-serif",display:"flex",alignItems:"center",
      gap:"12px",margin:"0 auto",transition:"all .2s",boxShadow:"0 2px 8px rgba(0,0,0,0.2)"
    },onClick:signInWithGoogle});
    googleBtn.innerHTML='<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Σύνδεση με Google';
    inner.appendChild(googleBtn);
    
    inner.appendChild(h("div",{style:{color:"#7A7594",fontSize:"11px",marginTop:"12px"}},"Συνδέσου για να μπορείς να μπεις από οποιαδήποτε συσκευή"));
  }
  
  outer.appendChild(inner);
  app.appendChild(outer);
}

function setDisplayName(){
  const name=state.inputName.trim();
  if(!name)return;
  state.username=name;
  saveToFirebase();render();
}

function doRename(){
  const name=state.newName.trim();
  if(!name||name===state.username){state.editingName=false;render();return;}
  state.username=name;state.editingName=false;
  saveToFirebase();render();
}

function tryAdmin(){
  if(state.adminPin===ADMIN_PIN){state.adminMode=true;state.showAdminInput=false;state.adminPin="";}
  else state.adminPin="";
  render();
}

// ===== INIT =====
// Dark mode from localStorage
try{
  const d=JSON.parse(localStorage.getItem("pride-dark")||"null");
  if(typeof d==="boolean"){state.dark=d;}
}catch(e){}
if(!state.dark)document.body.classList.add("light");
render();
setTimeout(prefetchAllPosters, 800);
</script>
